<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周诚智，生日快乐呀 ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #25345f 0%, #111827 45%, #050816 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      padding: 30px 24px;
      border-radius: 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .photo-wrap {
      display: inline-block;
      padding: 8px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ff8bb3, #ffd36e, #8ec5ff);
      margin-bottom: 22px;
      box-shadow: 0 0 40px rgba(255, 150, 190, 0.45);
    }

    .photo {
      display: block;
      width: 250px;
      max-width: 72vw;
      height: 250px;
      object-fit: cover;
      border-radius: 22px;
      background: #fff;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #ffe1ec;
      text-shadow: 0 0 18px rgba(255, 160, 200, 0.75);
    }

    .subtitle {
      font-size: 18px;
      color: #ffe9a8;
      margin-bottom: 22px;
    }

    .message {
      min-height: 245px;
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.13);
      color: #fff7fb;
      font-size: 17px;
      line-height: 2;
      text-align: left;
      white-space: pre-line;
      box-shadow: inset 0 0 22px rgba(255, 255, 255, 0.08);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #fff;
      margin-left: 3px;
      vertical-align: -3px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    .small {
      margin-top: 18px;
      color: #ffdce8;
      font-size: 14px;
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 16px;
        border-radius: 26px;
      }

      h1 {
        font-size: 25px;
      }

      .photo {
        width: 210px;
        height: 210px;
      }

      .message {
        font-size: 16px;
        min-height: 265px;
      }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <main class="card">
    <div class="photo-wrap">
      <img class="photo" src="photo.jpg" alt="我们的照片" />
    </div>

    <h1>周诚智，生日快乐呀 🎂</h1>
    <div class="subtitle">To my 猪咪 🐷❤️</div>

    <div class="message"><span id="typed"></span><span class="cursor"></span></div>

    <div class="small">隔着距离，也要把爱送到你身边 ✨</div>
  </main>

  <script>
    const blessing = `生日快乐呀猪咪🐷❤️
虽然我们隔着距离，但我很想很想你。
谢谢你一直陪着我、包容我、支持我。
希望新的一岁，你平安顺遂，所有努力都有回报。
我会继续好好爱你，等我们见面的那一天✨`;

    const typed = document.getElementById("typed");
    let index = 0;

    function typeText() {
      if (index <= blessing.length) {
        typed.textContent = blessing.slice(0, index);
        index++;
        setTimeout(typeText, 85);
      }
    }
    setTimeout(typeText, 700);

    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");

    let w, h;
    let stars = [];
    let fireworks = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      stars = Array.from({ length: Math.floor(w * h / 9000) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random(),
        speed: Math.random() * 0.018 + 0.006
      }));
    }

    window.addEventListener("resize", resize);
    resize();

    function createFirework() {
      const x = Math.random() * w * 0.8 + w * 0.1;
      const y = Math.random() * h * 0.45 + h * 0.08;
      const colors = ["#ff8bb3", "#ffd36e", "#8ec5ff", "#c084fc", "#ffffff"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const count = 70;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = Math.random() * 4 + 1.5;
        fireworks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 90,
          color,
          size: Math.random() * 2.2 + 1
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, w, h);

      for (const s of stars) {
        s.a += s.speed;
        const alpha = 0.35 + Math.sin(s.a) * 0.35;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }

      if (Math.random() < 0.035) createFirework();

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const p = fireworks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(p.life / 90, 0);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (p.life <= 0) fireworks.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
